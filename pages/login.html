<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tela de Login</title>
    <link rel="stylesheet" href="../css/login.css">
</head>
<header id="cabecalho">
    <center>
        <h1 id="demanda">Demanda</h1>
        <h1 id="track">Track</h1>
    </center>
</header>
<body>
    <center>
    <div id="formulario">
        <h2>Login</h2>
        <input type="text" id="user" placeholder="Nome de Usuário" required>
        <br><br>
        <input type="password" id="senha" placeholder="Senha" required>
        <br><br>
        <button type="submit" id="botao" onclick="window.location.href='../index.html'">Entrar</button>
    </div>
    </center>
</body>
</html>
