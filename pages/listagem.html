<!DOCTYPE html>
<!--
  Autor da estrutura e do layout: Nathan Kenzo Puzipe
  Ajustes para integracao com os dados: Pedro Tiezo Sales Shimizu
  Descricao: Tela de listagem de demandas. Os filtros e a tabela sao preenchidos
             em tempo de execucao pelo arquivo js/listagem.js.
-->
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>DemandaTrack - Demandas</title>

    <link rel="stylesheet" href="../css/listagem.css">
    <link rel="stylesheet" href="../css/simulacao.css">

</head>

<body>

    <div id="cabecalho">

        <div class="logo">
            Demanda<strong class="logo-destaque">Track</strong>
        </div>

        <div class="menu">
            <a href="login.html" class="item-menu">Login</a>
            <a href="dashboard.html" class="item-menu">Dashboard</a>
            <div class="item-menu item-menu-ativo">Demandas</div>
            <a href="demanda.html" class="item-menu">Nova Demanda</a>
        </div>

    </div>

    <!-- Barra temporaria de simulacao de perfil (ver js/simulacao.js) -->
    <div id="barra-simulacao"></div>


    <div class="conteudo">

        <div class="topo-pagina">
            <div>
                <h1>Demandas</h1>
                <p class="subtitulo" id="subtitulo-listagem">
                    Lista de todas as demandas cadastradas no sistema
                </p>
            </div>
            <!-- Botao exibido apenas para os perfis que podem criar demandas -->
            <a href="demanda.html" class="botao-nova-demanda oculto" id="botao-nova-demanda">
                + Nova demanda
            </a>
        </div>


        <div class="caixa-filtros">

            <div class="campo-filtro">
                <label class="rotulo" for="filtro-busca">Buscar</label>
                <input type="text" id="filtro-busca" class="campo-entrada"
                       placeholder="Titulo ou descricao">
            </div>

            <div class="campo-filtro">
                <label class="rotulo" for="filtro-status">Status</label>
                <select id="filtro-status" class="campo-entrada"></select>
            </div>

            <div class="campo-filtro">
                <label class="rotulo" for="filtro-prioridade">Prioridade</label>
                <select id="filtro-prioridade" class="campo-entrada"></select>
            </div>

            <div class="campo-filtro">
                <label class="rotulo" for="filtro-tipo">Tipo</label>
                <select id="filtro-tipo" class="campo-entrada"></select>
            </div>

            <div class="campo-filtro">
                <label class="rotulo" for="filtro-responsavel">Responsavel</label>
                <select id="filtro-responsavel" class="campo-entrada"></select>
            </div>

            <div class="campo-filtro">
                <label class="rotulo" for="filtro-projeto">Projeto</label>
                <select id="filtro-projeto" class="campo-entrada"></select>
            </div>

            <div class="campo-filtro">
                <label class="rotulo" for="filtro-ordem">Ordenar por</label>
                <select id="filtro-ordem" class="campo-entrada"></select>
            </div>

            <button type="button" class="botao-filtrar" id="botao-limpar">
                <strong>Limpar filtros</strong>
            </button>

        </div>


        <div class="caixa-tabela">

            <p class="contador-resultados" id="contador-resultados"></p>

            <table class="tabela-demandas" border="0">

                <thead>
                    <tr class="linha-cabecalho">
                        <th>Titulo</th>
                        <th>Tipo</th>
                        <th>Prioridade</th>
                        <th>Status</th>
                        <th>Projeto</th>
                        <th>Responsaveis</th>
                        <th>Criacao</th>
                        <th>Prazo</th>
                        <th></th>
                    </tr>
                </thead>

                <!-- As linhas sao geradas por js/listagem.js a partir das demandas -->
                <tbody id="corpo-tabela"></tbody>

            </table>

        </div>

    </div>

    <script src="../js/dados.js"></script>
    <script src="../js/permissoes.js"></script>
    <script src="../js/formato.js"></script>
    <script src="../js/simulacao.js"></script>
    <script src="../js/listagem.js"></script>

</body>

</html>
