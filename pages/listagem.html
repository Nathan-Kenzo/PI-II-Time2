<!DOCTYPE html>
<!--
  Autor da estrutura e do layout: Nathan Kenzo Puzipe
  Ajustes para integração com os dados: Pedro Tiezo Sales Shimizu
  Integração com a API: Nathan Kenzo Puzipe
  Descrição: Tela de listagem de demandas. Os filtros e a tabela são preenchidos
             em tempo de execução pelo arquivo js/listagem.js, com os dados de
             GET /demandas, GET /projetos e GET /usuarios (banco de dados).
-->
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>DemandaTrack - Demandas</title>

    <link rel="stylesheet" href="../css/listagem.css">
    <link rel="stylesheet" href="../css/sessao.css">

</head>

<body>

    <!-- Cabeçalho e menu, iguais nas telas internas (ver js/sessao.js) -->
    <header class="cabecalho">
        <div class="logo">Demanda<span>Track</span></div>

        <nav class="menu">
            <a href="dashboard.html">Dashboard</a>
            <a href="listagem.html" class="ativo">Demandas</a>
            <a href="demanda.html" id="menu-nova-demanda">Nova Demanda</a>
            <a href="login.html" id="link-sair">Sair</a>
        </nav>
    </header>

    <!-- Barra com o usuário logado (ver js/sessao.js) -->
    <div id="barra-usuario"></div>


    <div class="conteudo">

        <div class="topo-pagina">
            <div>
                <h1>Demandas</h1>
                <p class="subtitulo" id="subtitulo-listagem">
                    Lista de todas as demandas cadastradas no sistema
                </p>
            </div>
            <!-- Botão exibido apenas para os perfis que podem criar demandas -->
            <a href="demanda.html" class="botao-nova-demanda oculto" id="botao-nova-demanda">
                + Nova demanda
            </a>
        </div>


        <div class="caixa-filtros">

            <div class="campo-filtro">
                <label class="rotulo" for="filtro-busca">Buscar</label>
                <input type="text" id="filtro-busca" class="campo-entrada" maxlength="100"
                       placeholder="Título ou descrição">
            </div>

            <div class="campo-filtro">
                <label class="rotulo" for="filtro-status">Status</label>
                <select id="filtro-status" class="campo-entrada"></select>
            </div>

            <div class="campo-filtro">
                <label class="rotulo" for="filtro-prioridade">Prioridade</label>
                <select id="filtro-prioridade" class="campo-entrada"></select>
            </div>

            <div class="campo-filtro">
                <label class="rotulo" for="filtro-tipo">Tipo</label>
                <select id="filtro-tipo" class="campo-entrada"></select>
            </div>

            <div class="campo-filtro">
                <label class="rotulo" for="filtro-responsavel">Responsável</label>
                <select id="filtro-responsavel" class="campo-entrada"></select>
            </div>

            <div class="campo-filtro">
                <label class="rotulo" for="filtro-projeto">Projeto</label>
                <select id="filtro-projeto" class="campo-entrada"></select>
            </div>

            <div class="campo-filtro">
                <label class="rotulo" for="filtro-ordem">Ordenar por</label>
                <select id="filtro-ordem" class="campo-entrada"></select>
            </div>

            <button type="button" class="botao-limpar" id="botao-limpar">Limpar filtros</button>

        </div>


        <!-- Erros devolvidos pela API (400, 401...) ou falta de resposta do servidor -->
        <p class="resumo-erros" id="aviso-erro" role="alert" hidden></p>

        <div class="caixa-tabela">

            <p class="contador-resultados" id="contador-resultados"></p>

            <table class="tabela-demandas">

                <thead>
                    <tr class="linha-cabecalho">
                        <th>Título</th>
                        <th>Tipo</th>
                        <th>Prioridade</th>
                        <th>Status</th>
                        <th>Projeto</th>
                        <th>Responsável</th>
                        <th>Criação</th>
                        <th>Prazo</th>
                        <th></th>
                    </tr>
                </thead>

                <!-- As linhas são geradas por js/listagem.js a partir das demandas -->
                <tbody id="corpo-tabela"></tbody>

            </table>

        </div>

    </div>

    <script src="../js/dados.js"></script>
    <script src="../js/permissoes.js"></script>
    <script src="../js/formato.js"></script>
    <script src="../js/validacoes.js"></script>
    <script src="../js/sessao.js"></script>
    <script src="../js/listagem.js"></script>

</body>

</html>
