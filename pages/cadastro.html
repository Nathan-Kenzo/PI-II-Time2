<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tela de Cadastro</title>
    <link rel="stylesheet" href="../css/cadastro.css">
</head>
<header id="cabecalho">
    <center>
        <h1 id="demanda">Demanda</h1>
        <h1 id="track">Track</h1>
    </center>
</header>
<body>
    <center>
    <div id="formulario">
        <h2>Cadastro</h2>
        <input type="text" id="nome" placeholder="Nome Completo" required>
        <br><br>
        <input type="text" id="user" placeholder="Nome de Usuário" required>
        <br><br>
        <input type="email" id="email" placeholder="E-mail" required>
        <br><br>
        <input type="password" id="senha" placeholder="Senha" required>
        <br><br>
        <input type="password" id="confirmar" placeholder="Confirmar Senha" required>
        <br>
        <h5><a href="login.html">Já tem uma conta? Faça login</a></h5>
        <br>
        <button type="submit" id="botao" onclick="window.location.href='login.html'">Cadastrar</button>
    </div>
    </center>
</body>
</html>
