<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tela de Cadastro</title>
    <link rel="stylesheet" href="../css/cadastro.css">
    <script src="../js/cadastro.js" defer></script>
</head>

<header id="cabecalho">
    <center>
        <h1 id="demanda">Demanda</h1>
        <h1 id="track">Track</h1>
    </center>
</header>

<body>
    <center>
    <div id="formulario">
        <h2>Cadastro</h2>

        <form id="formCadastro">

            <input type="text" id="nome" placeholder="Nome Completo" required>
            <div id="erroNome" class="erro"></div>
            <br><br>

            <input type="text" id="user" placeholder="Nome de Usuário" required>
            <div id="erroUser" class="erro"></div>
            <br><br>

            <input type="email" id="email" placeholder="E-mail" required>
            <div id="erroEmail" class="erro"></div>
            <br><br>

            <input type="password" id="senha" placeholder="Senha" required>
            <div id="erroSenha" class="erro"></div>
            <br><br>

            <input type="password" id="confirmar" placeholder="Confirmar Senha" required>
            <div id="erroConfirmar" class="erro"></div>
            <br>

            <p class="link-ajuda"><a href="login.html">Já tem uma conta? Faça login</a></p>
            <br>

            <button type="submit" id="botao">Cadastrar</button>

        </form>
    </div>
    </center>
</body>
</html>
